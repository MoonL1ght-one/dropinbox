[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dropinbox"
version = "0.1.0"
description = "本地优先的下载文件夹收件箱：按文件类型、来源、内容关键词自动归档，可预览、可撤销，零第三方依赖。"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "QingShan", email = "2117924740@qq.com" }]
keywords = ["downloads", "file-organizer", "local-first", "privacy", "cli", "tauri-alternative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]

[project.scripts]
dropinbox = "dropinbox.cli:main"

[project.urls]
Homepage = "https://github.com/MoonL1ght-one/dropinbox"
Issues = "https://github.com/MoonL1ght-one/dropinbox/issues"

[tool.setuptools]
packages = ["dropinbox"]

[tool.setuptools.package-data]
dropinbox = ["web/*.html", "web/*.css", "web/*.js"]
